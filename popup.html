<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page OCR</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <main>
    <header class="popup-header">
      <div class="brand"><img src="icons/icon-48.png" width="39" height="39" alt=""><span>Page OCR</span></div>
      <p>PDF с поиском по тексту</p>
    </header>

    <section class="popup-document surface" id="document" aria-labelledby="designation" hidden>
      <h1 id="designation"></h1>
      <p id="document-name" hidden></p>
      <ul class="metadata">
        <li id="pages"></li>
        <li>Русский и английский</li>
      </ul>
    </section>

    <div class="popup-state" id="state">
      <p id="notice" class="hint" role="status">Проверяю вкладку документа…</p>
      <progress id="popup-progress" aria-label="Прогресс по страницам" hidden></progress>
    </div>
    <button class="button primary" id="start" type="button" disabled>Собрать PDF с OCR <span aria-hidden="true">↓</span></button>
  </main>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
